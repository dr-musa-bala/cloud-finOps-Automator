name: FinOps Automator Lean CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-scan:
    name: 1. Flake8 Lint & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. PYTHON LINTING (Flake8) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Run Flake8
        run: |
          pip install flake8
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level checks for code style
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      # --- 2. HELM LINTING ---
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: helm lint finops-chart/

      # --- 3. TRIVY SECURITY SCAN (FS / Dockerfiles) ---
      - name: Run Trivy Repository Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    name: 2. Docker Build & Push
    needs: lint-and-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Scan Reaper Container Image
      - name: Build and Push Reaper Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.reaper
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finops-reaper:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/finops-reaper:${{ github.sha }}

      # Build & Scan Cleaner Container Image
      - name: Build and Push Cleaner Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cleaner
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finops-cleaner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/finops-cleaner:${{ github.sha }}
