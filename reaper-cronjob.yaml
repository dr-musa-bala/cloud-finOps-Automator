apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-reaper
  labels:
    app: finops-automator
spec:
  schedule: "{{ .Values.reaper.schedule }}"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: finops-automator
        spec:
          hostNetwork: true
          containers:
          - name: reaper
            image: {{ .Values.reaper.image }}
            imagePullPolicy: {{ .Values.reaper.imagePullPolicy | default "Never" }}
            env:
            - name: PUSHGATEWAY_URL
              value: "{{ .Values.global.pushgatewayUrl }}"
            - name: FLOCI_ENDPOINT
              value: "{{ .Values.global.flociEndpoint }}"
            - name: AWS_ACCESS_KEY_ID
              value: "{{ .Values.global.awsAccessKeyId | default "floci" }}"
            - name: AWS_SECRET_ACCESS_KEY
              value: "{{ .Values.global.awsSecretAccessKey | default "floci" }}"
            - name: AWS_DEFAULT_REGION
              value: "{{ .Values.global.region }}"
          restartPolicy: OnFailure