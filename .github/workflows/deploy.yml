name: FinOps Automator CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint finops-chart/

  build-and-push:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Reaper Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.reaper
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finops-reaper:latest,${{ secrets.DOCKERHUB_USERNAME }}/finops-reaper:${{ github.sha }}

      - name: Build and Push Cleaner Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cleaner
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finops-cleaner:latest,${{ secrets.DOCKERHUB_USERNAME }}/finops-cleaner:${{ github.sha }}
